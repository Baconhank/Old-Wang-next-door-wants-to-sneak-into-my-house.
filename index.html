<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隔壁老王要偷家</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 遊戲主畫面容器 (16:9) */
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 960px;
      height: 540px;
      background-color: #1e293b;
      background-size: cover;
      background-position: center;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 全螢幕遮罩層 */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 36px;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .menu-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      min-width: 240px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    /* 成就清單視窗 */
    #achievement-modal {
      width: 80%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 24px;
      max-height: 80%;
      overflow-y: auto;
    }

    .achieve-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .achieve-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .achieve-item {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .achieve-item.unlocked {
      opacity: 1;
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.05);
    }

    .achieve-icon {
      font-size: 1.8rem;
      margin-right: 14px;
    }

    .achieve-info h4 {
      font-size: 1rem;
      margin-bottom: 4px;
      color: #e2e8f0;
    }

    .achieve-item.unlocked h4 {
      color: #fbbf24;
    }

    .achieve-info p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* 角色立繪區 */
    #character-layer {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      height: 70%;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #character-layer img {
      max-height: 100%;
      object-fit: contain;
    }

    /* 對話框區域 */
    #dialogue-box {
      position: relative;
      background: rgba(15, 23, 42, 0.92);
      border-top: 2px solid #38bdf8;
      padding: 20px 24px 16px;
      min-height: 130px;
      cursor: pointer;
      z-index: 10;
    }

    #speaker-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-bottom: 6px;
      min-height: 24px;
    }

    #dialogue-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f1f5f9;
      min-height: 50px;
    }

    /* 右上角控制列 */
    #control-bar {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* 劇情選擇層 */
    #choice-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 30;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 起始選單 -->
    <div id="start-menu" class="overlay-screen">
      <div class="title">隔壁老王要偷家</div>
      <button id="btn-start" class="menu-btn">開始遊戲</button>
      <button id="btn-achieve" class="menu-btn">成就列表</button>
    </div>

    <!-- 成就視窗 -->
    <div id="achieve-screen" class="overlay-screen hidden">
      <div id="achievement-modal">
        <div class="achieve-header">
          <h2>成就列表</h2>
          <button id="btn-close-achieve" class="ctrl-btn">返回選單</button>
        </div>
        <div id="achieve-items-container" class="achieve-list"></div>
      </div>
    </div>

    <!-- 控制列 -->
    <div id="control-bar">
      <button id="home-btn" class="ctrl-btn">主選單</button>
      <button id="skip-btn" class="ctrl-btn">SKIP</button>
    </div>

    <!-- 立繪區 -->
    <div id="character-layer">
      <img id="character-img" class="hidden" alt="角色立繪">
    </div>

    <!-- 對話框 -->
    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
    </div>

    <!-- 選擇層 -->
    <div id="choice-layer" class="hidden"></div>
  </div>

  <script>
    // 成就資料庫
    const ACHIEVEMENTS = [
      {
        id: "achieve_ex",
        title: "電影之約",
        desc: "決定約前女友去看電影。",
        icon: "🎬"
      },
      {
        id: "achieve_food",
        title: "老饕回歸",
        desc: "回國第一件事就是怒吃當歸鴨肉飯！",
        icon: "🍲"
      }
    ];

    // 劇本節點庫：每句獨立呈現
    const storyScript = {
      intro_1: {
        speaker: "隔壁老王",
        text: "我叫隔壁老王",
        nextNode: "intro_2"
      },
      intro_2: {
        speaker: "隔壁老王",
        text: "是個漂泊在外的留子",
        nextNode: "intro_3"
      },
      intro_3: {
        speaker: "隔壁老王",
        text: "至於我為甚麼現在會在機場",
        nextNode: "intro_4"
      },
      intro_4: {
        speaker: "隔壁老王",
        text: "一切的起因是.....",
        nextNode: "intro_flashback"
      },
      intro_flashback: {
        speaker: "旁白",
        text: "「在不久之前」",
        nextNode: "intro_5"
      },
      intro_5: {
        speaker: "隔壁老王",
        text: "我獨自在國外的租屋處時",
        nextNode: "intro_6"
      },
      intro_6: {
        speaker: "隔壁老王",
        text: "手機突然跳出了一則訊息",
        nextNode: "intro_7"
      },
      intro_7: {
        speaker: "隔壁老王",
        text: "是那個一直偷偷背著現任男友跟我聯絡的前女友傳來的訊息",
        nextNode: "intro_msg"
      },
      intro_msg: {
        speaker: "前女友的訊息",
        text: "「我沒想過三年後我還會因為你掉眼淚，好笑了」",
        nextNode: "intro_8"
      },
      intro_8: {
        speaker: "隔壁老王",
        text: "雖然我的心裡知道我們的戀情已經停止在三年前的夏天",
        nextNode: "intro_9"
      },
      intro_9: {
        speaker: "隔壁老王",
        text: "但我的手還不自覺地收起行李",
        nextNode: "intro_10"
      },
      intro_10: {
        speaker: "隔壁老王",
        text: "所以一直在國外拈花惹草的我",
        nextNode: "intro_11"
      },
      intro_11: {
        speaker: "隔壁老王",
        text: "這次回來就只有一個目的",
        nextNode: "intro_12"
      },
      intro_12: {
        speaker: "隔壁老王",
        text: "「奪回屬於我的榮耀!!!」",
        nextNode: "intro_13"
      },
      intro_13: {
        speaker: "隔壁老王",
        text: "當然還有吃一碗香噴噴的鴨肉飯",
        nextNode: "intro_14"
      },
      intro_14: {
        speaker: "隔壁老王",
        text: "畢竟我把輸家當早餐吃",
        nextNode: "choice_hub"
      },
      choice_hub: {
        speaker: "隔壁老王",
        text: "不知道現在要幹嘛呢",
        choices: [
          { text: "去找前女友", nextNode: "route_ex" },
          { text: "吃鴨肉飯", nextNode: "route_food" }
        ]
      },
      route_ex: {
        speaker: "隔壁老王",
        text: "那約她去看個電影好了",
        unlockAchievement: "achieve_ex",
        nextNode: "end"
      },
      route_food: {
        speaker: "隔壁老王",
        text: "好主意！巷口那間當歸鴨肉飯我朝思暮想好久了，走起！",
        unlockAchievement: "achieve_food",
        nextNode: "end"
      },
      end: {
        speaker: "系統",
        text: "【章節結束】點擊對話框返回起始選單。",
        onNext: () => returnToMenu()
      }
    };

    // 狀態變數
    let currentNodeKey = "intro_1";
    let isTyping = false;
    let typeTimer = null;
    let currentFullText = "";

    // DOM 元素
    const startMenu = document.getElementById("start-menu");
    const achieveScreen = document.getElementById("achieve-screen");
    const dialogueBox = document.getElementById("dialogue-box");
    const speakerEl = document.getElementById("speaker-name");
    const textEl = document.getElementById("dialogue-text");
    const choiceLayer = document.getElementById("choice-layer");
    const skipBtn = document.getElementById("skip-btn");
    const homeBtn = document.getElementById("home-btn");
    const btnStart = document.getElementById("btn-start");
    const btnAchieve = document.getElementById("btn-achieve");
    const btnCloseAchieve = document.getElementById("btn-close-achieve");
    const achieveItemsContainer = document.getElementById("achieve-items-container");

    // 成就核心邏輯
    function getUnlockedAchievements() {
      try {
        return JSON.parse(localStorage.getItem("vn_achievements") || "[]");
      } catch {
        return [];
      }
    }

    function unlockAchievement(id) {
      const unlocked = getUnlockedAchievements();
      if (!unlocked.includes(id)) {
        unlocked.push(id);
        localStorage.setItem("vn_achievements", JSON.stringify(unlocked));
      }
    }

    function renderAchievementList() {
      const unlocked = getUnlockedAchievements();
      achieveItemsContainer.innerHTML = "";

      ACHIEVEMENTS.forEach(ach => {
        const isUnlocked = unlocked.includes(ach.id);
        const item = document.createElement("div");
        item.className = `achieve-item ${isUnlocked ? "unlocked" : ""}`;
        item.innerHTML = `
          <div class="achieve-icon">${isUnlocked ? ach.icon : "🔒"}</div>
          <div class="achieve-info">
            <h4>${isUnlocked ? ach.title : "？？？"}</h4>
            <p>${isUnlocked ? ach.desc : "尚未解鎖此成就"}</p>
          </div>
        `;
        achieveItemsContainer.appendChild(item);
      });
    }

    // 遊戲流程
    function startGame() {
      startMenu.classList.add("hidden");
      achieveScreen.classList.add("hidden");
      renderNode("intro_1");
    }

    function returnToMenu() {
      clearInterval(typeTimer);
      isTyping = false;
      choiceLayer.classList.add("hidden");
      startMenu.classList.remove("hidden");
    }

    function renderNode(nodeKey) {
      const node = storyScript[nodeKey];
      if (!node) return;

      currentNodeKey = nodeKey;
      speakerEl.textContent = node.speaker || "";
      choiceLayer.classList.add("hidden");
      choiceLayer.innerHTML = "";

      if (node.unlockAchievement) {
        unlockAchievement(node.unlockAchievement);
      }

      typewriter(node.text, () => {
        if (node.choices && node.choices.length > 0) {
          showChoices(node.choices);
        }
      });
    }

    function typewriter(fullText, onComplete) {
      clearInterval(typeTimer);
      isTyping = true;
      currentFullText = fullText;
      textEl.textContent = "";

      let charIndex = 0;
      typeTimer = setInterval(() => {
        textEl.textContent += fullText[charIndex];
        charIndex++;

        if (charIndex >= fullText.length) {
          clearInterval(typeTimer);
          isTyping = false;
          if (onComplete) onComplete();
        }
      }, 35);
    }

    function completeTextInstantly() {
      clearInterval(typeTimer);
      textEl.textContent = currentFullText;
      isTyping = false;

      const node = storyScript[currentNodeKey];
      if (node.choices && node.choices.length > 0) {
        showChoices(node.choices);
      }
    }

    function showChoices(choices) {
      choiceLayer.innerHTML = "";
      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "menu-btn";
        btn.textContent = choice.text;
        btn.onclick = () => renderNode(choice.nextNode);
        choiceLayer.appendChild(btn);
      });
      choiceLayer.classList.remove("hidden");
    }

    // 事件綁定
    btnStart.addEventListener("click", startGame);

    btnAchieve.addEventListener("click", () => {
      renderAchievementList();
      achieveScreen.classList.remove("hidden");
    });

    btnCloseAchieve.addEventListener("click", () => {
      achieveScreen.classList.add("hidden");
    });

    homeBtn.addEventListener("click", returnToMenu);

    dialogueBox.addEventListener("click", () => {
      const node = storyScript[currentNodeKey];

      if (isTyping) {
        completeTextInstantly();
        return;
      }

      if (node.choices && node.choices.length > 0) return;

      if (node.onNext) {
        node.onNext();
      } else if (node.nextNode) {
        renderNode(node.nextNode);
      }
    });

    skipBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const node = storyScript[currentNodeKey];

      if (isTyping) {
        completeTextInstantly();
      } else if (node.nextNode && (!node.choices || node.choices.length === 0)) {
        renderNode(node.nextNode);
      }
    });
  </script>
</body>
</html>
