<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隔壁老王要偷家</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      max-width: 960px;
      height: 540px;
      background-color: #000000;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #background-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      z-index: 1;
    }

    #character-layer {
      position: absolute;
      bottom: 0px;
      left: 50%;
      transform: translateX(-50%);
      height: 82%;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      z-index: 2;
    }

    #character-layer img {
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 36px;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .menu-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      min-width: 240px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    #achievement-modal {
      width: 80%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 24px;
      max-height: 80%;
      overflow-y: auto;
    }

    .achieve-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .achieve-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .achieve-item {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .achieve-item.unlocked {
      opacity: 1;
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.05);
    }

    .achieve-icon {
      font-size: 1.8rem;
      margin-right: 14px;
    }

    .achieve-info h4 {
      font-size: 1rem;
      margin-bottom: 4px;
      color: #e2e8f0;
    }

    .achieve-item.unlocked h4 {
      color: #fbbf24;
    }

    .achieve-info p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #cutscene-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      z-index: 50;
      overflow: hidden;
      cursor: pointer;
    }

    #plane-sprite {
      position: absolute;
      width: 160px;
      height: auto;
      top: -120px;
      left: -160px;
      opacity: 0.95;
      transform: rotate(35deg);
      pointer-events: none;
      filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.6));
    }

    @keyframes planeLandingMotion {
      0% {
        top: -120px;
        left: -160px;
        transform: rotate(32deg) scale(0.65);
        opacity: 0.3;
      }
      20% { opacity: 1; }
      100% {
        top: 480px;
        left: 1050px;
        transform: rotate(36deg) scale(1.15);
        opacity: 1;
      }
    }

    .anim-plane-landing {
      animation: planeLandingMotion 3.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    #phone-interactive-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      bottom: 135px;
      background: rgba(0, 0, 0, 0.45);
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out;
      padding: 16px 0;
    }

    #phone-interactive-layer.active {
      opacity: 1;
      pointer-events: auto;
    }

    .phone-wrapper {
      position: relative;
      height: 100%;
      max-height: 360px;
      border-radius: 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 0 3px #222;
      overflow: hidden;
      transform: translateY(15px);
      transition: transform 0.4s ease-out;
    }

    #phone-interactive-layer.active .phone-wrapper {
      transform: translateY(0);
    }

    .phone-wrapper img {
      height: 100%;
      width: auto;
      display: block;
    }

    #ig-notif-hitbox {
      position: absolute;
      top: 36.5%;
      left: 4.5%;
      width: 91%;
      height: 12.5%;
      cursor: pointer;
      border-radius: 14px;
      transition: background 0.2s, box-shadow 0.2s;
      animation: notifPulse 1.8s infinite;
    }

    #ig-notif-hitbox:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    @keyframes notifPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(225, 48, 108, 0.4);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(225, 48, 108, 0.7);
      }
    }

    @keyframes phoneShake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-3px, 2px); }
      30% { transform: translate(3px, -2px); }
      45% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      75% { transform: translate(-1px, 1px); }
    }

    .vibrate-box {
      animation: phoneShake 0.15s ease-in-out infinite;
    }

    #dialogue-box {
      position: relative;
      background: rgba(15, 23, 42, 0.95);
      border-top: 2px solid #38bdf8;
      padding: 18px 24px 16px;
      min-height: 130px;
      cursor: pointer;
      z-index: 40;
    }

    #speaker-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-bottom: 6px;
      min-height: 24px;
    }

    #dialogue-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f1f5f9;
      min-height: 50px;
    }

    #control-bar {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 60;
    }

    .volume-control-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .volume-icon {
      font-size: 0.85rem;
      user-select: none;
    }

    .volume-slider {
      width: 75px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #475569;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .ctrl-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .ctrl-btn:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #choice-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 70;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <audio id="bgm-player" src="assets/bgm.mp3" loop preload="auto"></audio>

    <div id="background-layer"></div>

    <div id="character-layer">
      <img id="character-img" src="" alt="角色立繪">
    </div>

    <div id="phone-interactive-layer">
      <div class="phone-wrapper">
        <img src="assets/phone.png" alt="手機螢幕">
        <div id="ig-notif-hitbox" title="點擊檢視 Instagram 通知"></div>
      </div>
    </div>

    <div id="start-menu" class="overlay-screen">
      <div class="title">隔壁老王要偷家</div>
      <button id="btn-start" class="menu-btn">開始遊戲</button>
      <button id="btn-achieve" class="menu-btn">成就列表</button>
    </div>

    <div id="achieve-screen" class="overlay-screen hidden">
      <div id="achievement-modal">
        <div class="achieve-header">
          <h2>成就列表</h2>
          <button id="btn-close-achieve" class="ctrl-btn">返回選單</button>
        </div>
        <div id="achieve-items-container" class="achieve-list"></div>
      </div>
    </div>

    <div id="cutscene-layer" class="hidden">
      <img id="plane-sprite" src="assets/plane.png" alt="飛機降落">
    </div>

    <div id="control-bar">
      <div class="volume-control-box" title="背景音樂音量">
        <span class="volume-icon">🔊</span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.7">
      </div>
      <button id="home-btn" class="ctrl-btn">主選單</button>
      <button id="back-btn" class="ctrl-btn">BACK</button>
      <button id="skip-btn" class="ctrl-btn">SKIP</button>
    </div>

    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
    </div>

    <div id="choice-layer" class="hidden"></div>
  </div>

  <script>
    // ===== Web Audio API 音訊圖 =====
    const bgmPlayer = document.getElementById("bgm-player");
    const volumeSlider = document.getElementById("volume-slider");

    let audioCtx = null;
    let bgmGainNode = null;
    let bgmSourceNode = null;

    function initAudioGraph() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        bgmGainNode = audioCtx.createGain();
        bgmSourceNode = audioCtx.createMediaElementSource(bgmPlayer);
        
        bgmSourceNode.connect(bgmGainNode);
        bgmGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    volumeSlider.addEventListener("input", (e) => {
      const vol = parseFloat(e.target.value);
      if (bgmGainNode && audioCtx) {
        bgmGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        bgmGainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
      }
    });

    function playBgm() {
      initAudioGraph();
      const targetVol = parseFloat(volumeSlider.value);
      bgmGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      bgmGainNode.gain.setValueAtTime(targetVol, audioCtx.currentTime);

      if (bgmPlayer.paused) {
        bgmPlayer.play().catch(err => console.warn("BGM 播放被瀏覽器限制", err));
      }
    }

    function fadeOutBgm(duration = 2.5) {
      if (!audioCtx || !bgmGainNode || bgmPlayer.paused) return;

      const currTime = audioCtx.currentTime;
      const currVol = bgmGainNode.gain.value;

      bgmGainNode.gain.cancelScheduledValues(currTime);
      bgmGainNode.gain.setValueAtTime(currVol, currTime);
      bgmGainNode.gain.linearRampToValueAtTime(0.0001, currTime + duration);

      setTimeout(() => {
        if (bgmGainNode.gain.value <= 0.05) {
          bgmPlayer.pause();
          bgmPlayer.currentTime = 0;
          bgmGainNode.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);
        }
      }, duration * 1000);
    }

    function stopBgmInstant() {
      if (audioCtx && bgmGainNode) {
        bgmGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        bgmGainNode.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);
      }
      bgmPlayer.pause();
      bgmPlayer.currentTime = 0;
    }

    function playPlaneLandingSound() {
      try {
        initAudioGraph();
        const ctx = audioCtx;

        const bufferSize = ctx.sampleRate * 3.5;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(800, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 3.2);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 1.0);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
        noise.stop(ctx.currentTime + 3.5);
      } catch (e) {
        console.warn("飛機音效播放失敗", e);
      }
    }

    function playPhoneVibrateSound() {
      try {
        initAudioGraph();
        const ctx = audioCtx;

        const box = document.getElementById("dialogue-box");
        box.classList.add("vibrate-box");
        setTimeout(() => box.classList.remove("vibrate-box"), 650);

        function triggerVibeBurst(startTime) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(125, startTime);

          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(260, startTime);

          gain.gain.setValueAtTime(0.01, startTime);
          gain.gain.linearRampToValueAtTime(0.35, startTime + 0.05);
          gain.gain.linearRampToValueAtTime(0.01, startTime + 0.25);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.25);
        }

        triggerVibeBurst(ctx.currentTime);
        triggerVibeBurst(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn("震動音效播放失敗", e);
      }
    }

    // ===== 全新成就系統 =====
    const ACHIEVEMENTS = [
      {
        id: "achieve_bad_coward",
        title: "無膽匪類",
        desc: "在旅館前臨陣脫逃，被大耳狗光速封鎖。",
        icon: "🐔"
      },
      {
        id: "achieve_bear_sub",
        title: "新世界的大門",
        desc: "跟 178 特級亞大熊男交往，成功被開發成騷0。",
        icon: "🌈"
      },
      {
        id: "achieve_righteous",
        title: "正直的男人",
        desc: "在大耳狗想當壞女人時義正嚴詞拒絕，守護道德底線。",
        icon: "🛡️"
      },
      {
        id: "achieve_waver",
        title: "夜半的動搖",
        desc: "深夜聽見大耳狗醉後的真心告白，偷家大戰邁向高潮。",
        icon: "🍷"
      }
    ];

    function getUnlockedAchievements() {
      try {
        return JSON.parse(localStorage.getItem("vn_achievements") || "[]");
      } catch {
        return [];
      }
    }

    function unlockAchievement(id) {
      const unlocked = getUnlockedAchievements();
      if (!unlocked.includes(id)) {
        unlocked.push(id);
        localStorage.setItem("vn_achievements", JSON.stringify(unlocked));
      }
    }

    function renderAchievementList() {
      const unlocked = getUnlockedAchievements();
      const container = document.getElementById("achieve-items-container");
      container.innerHTML = "";

      ACHIEVEMENTS.forEach(ach => {
        const isUnlocked = unlocked.includes(ach.id);
        const item = document.createElement("div");
        item.className = `achieve-item ${isUnlocked ? "unlocked" : ""}`;
        item.innerHTML = `
          <div class="achieve-icon">${isUnlocked ? ach.icon : "🔒"}</div>
          <div class="achieve-info">
            <h4>${isUnlocked ? ach.title : "？？？"}</h4>
            <p>${isUnlocked ? ach.desc : "尚未解鎖此成就"}</p>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // ===== 劇本資料庫 (含事件一至四與全部分歧分支) =====
    const storyScript = {
      // --- 開場回憶 ---
      intro_1: {
        speaker: "隔壁老王",
        text: "我叫隔壁老王",
        bg: "assets/airport.jpg",
        character: "assets/laowang.png",
        nextNode: "intro_2"
      },
      intro_2: {
        speaker: "隔壁老王",
        text: "是個漂泊在外的留子",
        bg: "assets/airport.jpg",
        character: "assets/laowang.png",
        nextNode: "intro_3"
      },
      intro_3: {
        speaker: "隔壁老王",
        text: "至於我為甚麼現在會在機場",
        bg: "assets/airport.jpg",
        character: "assets/laowang.png",
        nextNode: "intro_4"
      },
      intro_4: {
        speaker: "隔壁老王",
        text: "一切的起因是.....",
        bg: "assets/airport.jpg",
        character: "assets/laowang.png",
        nextNode: "intro_flashback"
      },
      intro_flashback: {
        speaker: "旁白",
        text: "「在不久之前」",
        bg: null,
        character: null,
        nextNode: "intro_5"
      },
      intro_5: {
        speaker: "隔壁老王",
        text: "我獨自在國外的租屋處時",
        bg: "assets/room.jpg",
        character: null,
        nextNode: "intro_6"
      },
      intro_6: {
        speaker: "隔壁老王",
        text: "手機突然跳出了一則訊息",
        bg: "assets/room.jpg",
        character: null,
        onEnter: () => playPhoneVibrateSound(),
        nextNode: "intro_7"
      },
      intro_7: {
        speaker: "隔壁老王",
        text: "是那個一直偷偷背著現任男友跟我聯絡的大耳狗傳來的訊息\n（請點擊手機上的 Instagram 通知讀取）",
        bg: "assets/room.jpg",
        character: null,
        showPhone: true,
        requirePhoneClick: true,
        nextNode: "intro_msg"
      },
      intro_msg: {
        speaker: "大耳狗的訊息",
        text: "「我沒想過三年後我還會因為你掉眼淚，好笑了」",
        bg: "assets/chat.jpg",
        character: null,
        onEnter: () => playBgm(),
        nextNode: "intro_8"
      },
      intro_8: {
        speaker: "隔壁老王",
        text: "雖然我的心裡知道我們的戀情已經停止在三年前的夏天",
        bg: "assets/chat.jpg",
        character: null,
        nextNode: "intro_9"
      },
      intro_9: {
        speaker: "隔壁老王",
        text: "但我的手還不自覺地收起行李",
        bg: "assets/chat.jpg",
        character: null,
        nextNode: "intro_10"
      },
      intro_10: {
        speaker: "隔壁老王",
        text: "所以一直在國外拈花惹草的我",
        bg: "assets/room.jpg",
        character: null,
        nextNode: "intro_11"
      },
      intro_11: {
        speaker: "隔壁老王",
        text: "這次回來就只有一個目的",
        bg: "assets/airport.jpg",
        character: "assets/laowang.png",
        onEnter: () => fadeOutBgm(2.5),
        nextNode: "intro_12"
      },
      intro_12: {
        speaker: "隔壁老王",
        text: "「奪回屬於我的榮耀!!!」",
        bg: "assets/airport.jpg",
        character: "assets/laowang.png",
        nextNode: "intro_13"
      },
      intro_13: {
        speaker: "隔壁老王",
        text: "當然還有吃一碗香噴噴的鴨肉飯",
        bg: "assets/airport.jpg",
        character: "assets/laowang.png",
        nextNode: "intro_14"
      },

    };

    // ===== 遊戲流程管理 =====
    let currentNodeKey = "intro_1";
    let isTyping = false;
    let typeTimer = null;
    let currentFullText = "";
    let cutsceneTimer = null;
    let currentBgSrc = "";
    let currentCharacterSrc = "";
    let historyStack = [];

    const startMenu = document.getElementById("start-menu");
    const achieveScreen = document.getElementById("achieve-screen");
    const cutsceneLayer = document.getElementById("cutscene-layer");
    const planeSprite = document.getElementById("plane-sprite");
    const phoneInteractiveLayer = document.getElementById("phone-interactive-layer");
    const igNotifHitbox = document.getElementById("ig-notif-hitbox");
    const bgLayer = document.getElementById("background-layer");
    const charLayer = document.getElementById("character-layer");
    const charImg = document.getElementById("character-img");
    const dialogueBox = document.getElementById("dialogue-box");
    const speakerEl = document.getElementById("speaker-name");
    const textEl = document.getElementById("dialogue-text");
    const choiceLayer = document.getElementById("choice-layer");
    const skipBtn = document.getElementById("skip-btn");
    const backBtn = document.getElementById("back-btn");
    const homeBtn = document.getElementById("home-btn");

    function updateVisualLayers(node) {
      if (node.bg) {
        if (currentBgSrc !== node.bg) {
          currentBgSrc = node.bg;
          bgLayer.style.backgroundImage = `url('${node.bg}')`;
          bgLayer.style.opacity = "1";
        }
      } else {
        currentBgSrc = "";
        bgLayer.style.opacity = "0";
      }

      if (node.character) {
        if (currentCharacterSrc !== node.character) {
          currentCharacterSrc = node.character;
          charImg.src = node.character;
          charLayer.style.opacity = "1";
        }
      } else {
        currentCharacterSrc = "";
        charLayer.style.opacity = "0";
      }

      if (node.showPhone) {
        phoneInteractiveLayer.classList.add("active");
      } else {
        phoneInteractiveLayer.classList.remove("active");
      }
    }

    function playIntroCutscene(onComplete) {
      cutsceneLayer.classList.remove("hidden");
      planeSprite.classList.remove("anim-plane-landing");
      void planeSprite.offsetWidth;

      playPlaneLandingSound();
      planeSprite.classList.add("anim-plane-landing");

      const finishCutscene = () => {
        clearTimeout(cutsceneTimer);
        cutsceneLayer.removeEventListener("click", finishCutscene);
        cutsceneLayer.classList.add("hidden");
        planeSprite.classList.remove("anim-plane-landing");
        if (onComplete) onComplete();
      };

      cutsceneLayer.addEventListener("click", finishCutscene);
      cutsceneTimer = setTimeout(finishCutscene, 3500);
    }

    function startGame() {
      initAudioGraph();
      startMenu.classList.add("hidden");
      achieveScreen.classList.add("hidden");
      phoneInteractiveLayer.classList.remove("active");

      currentBgSrc = "";
      currentCharacterSrc = "";
      bgLayer.style.opacity = "0";
      charLayer.style.opacity = "0";
      historyStack = [];
      updateBackButtonState();

      playIntroCutscene(() => {
        renderNode("intro_1", false);
      });
    }

    function returnToMenu() {
      clearInterval(typeTimer);
      clearTimeout(cutsceneTimer);
      isTyping = false;
      stopBgmInstant();
      cutsceneLayer.classList.add("hidden");
      phoneInteractiveLayer.classList.remove("active");
      choiceLayer.classList.add("hidden");
      bgLayer.style.opacity = "0";
      charLayer.style.opacity = "0";
      currentBgSrc = "";
      currentCharacterSrc = "";
      historyStack = [];
      startMenu.classList.remove("hidden");
    }

    function updateBackButtonState() {
      backBtn.disabled = historyStack.length === 0;
    }

    function renderNode(nodeKey, pushHistory = true) {
      const node = storyScript[nodeKey];
      if (!node) return;

      if (pushHistory && currentNodeKey) {
        historyStack.push(currentNodeKey);
      }
      updateBackButtonState();

      currentNodeKey = nodeKey;
      speakerEl.textContent = node.speaker || "";
      choiceLayer.classList.add("hidden");
      choiceLayer.innerHTML = "";

      updateVisualLayers(node);

      if (typeof node.onEnter === "function") {
        node.onEnter();
      }

      if (node.unlockAchievement) {
        unlockAchievement(node.unlockAchievement);
      }

      typewriter(node.text, () => {
        if (node.choices && node.choices.length > 0) {
          showChoices(node.choices);
        }
      });
    }

    function goBack() {
      if (historyStack.length === 0) return;
      clearInterval(typeTimer);
      isTyping = false;
      const prevNodeKey = historyStack.pop();
      renderNode(prevNodeKey, false);
    }

    function typewriter(fullText, onComplete) {
      clearInterval(typeTimer);
      isTyping = true;
      currentFullText = fullText;
      textEl.textContent = "";

      let charIndex = 0;
      typeTimer = setInterval(() => {
        textEl.textContent += fullText[charIndex];
        charIndex++;

        if (charIndex >= fullText.length) {
          clearInterval(typeTimer);
          isTyping = false;
          if (onComplete) onComplete();
        }
      }, 35);
    }

    function completeTextInstantly() {
      clearInterval(typeTimer);
      textEl.textContent = currentFullText;
      isTyping = false;

      const node = storyScript[currentNodeKey];
      if (node.choices && node.choices.length > 0) {
        showChoices(node.choices);
      }
    }

    function showChoices(choices) {
      choiceLayer.innerHTML = "";
      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "menu-btn";
        btn.textContent = choice.text;
        btn.onclick = () => renderNode(choice.nextNode);
        choiceLayer.appendChild(btn);
      });
      choiceLayer.classList.remove("hidden");
    }

    igNotifHitbox.addEventListener("click", (e) => {
      e.stopPropagation();
      const node = storyScript[currentNodeKey];
      if (node && node.requirePhoneClick) {
        phoneInteractiveLayer.classList.remove("active");
        renderNode(node.nextNode);
      }
    });

    document.getElementById("btn-start").addEventListener("click", startGame);

    document.getElementById("btn-achieve").addEventListener("click", () => {
      renderAchievementList();
      achieveScreen.classList.remove("hidden");
    });

    document.getElementById("btn-close-achieve").addEventListener("click", () => {
      achieveScreen.classList.add("hidden");
    });

    homeBtn.addEventListener("click", returnToMenu);

    backBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      goBack();
    });

    dialogueBox.addEventListener("click", () => {
      const node = storyScript[currentNodeKey];

      if (isTyping) {
        completeTextInstantly();
        return;
      }

      if (node.requirePhoneClick) {
        return;
      }

      if (node.choices && node.choices.length > 0) return;

      if (node.onNext) {
        node.onNext();
      } else if (node.nextNode) {
        renderNode(node.nextNode);
      }
    });

    skipBtn.addEventListener("click", (e) => {
      e.stopPropagation();

      if (!cutsceneLayer.classList.contains("hidden")) {
        clearTimeout(cutsceneTimer);
        cutsceneLayer.classList.add("hidden");
        renderNode("intro_1", false);
        return;
      }

      const node = storyScript[currentNodeKey];
      if (isTyping) {
        completeTextInstantly();
      } else if (node.nextNode && (!node.choices || node.choices.length === 0) && !node.requirePhoneClick) {
        renderNode(node.nextNode);
      }
    });
  </script>
